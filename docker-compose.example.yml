# Example deployment: Jellyfin + jellycrew behind Traefik.
#
# Exposure model (two routers on one container):
#   - admin UI      : internal hostname only (users.home.arpa), never on the internet
#   - public router : the public hostname, restricted to the self-service paths
#                     (/invite, /reset, /me, /healthz, /api/public) and static assets
#
# Copy to docker-compose.yml, fill in the env values (or a .env file) and adjust hostnames.
services:
  traefik:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # add your ACME resolver here
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /srv/media:/media:ro
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.example.com`)
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096

  jellycrew:
    image: ghcr.io/rurudev/jellycrew:latest # or: build: .
    depends_on:
      - jellyfin
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?create one in Jellyfin Dashboard > API Keys}
      PUBLIC_BASE_URL: https://users.example.com
      SESSION_SECRET: ${SESSION_SECRET:?openssl rand -hex 32}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: info
      # DATA_DIR defaults to /data inside the image
    volumes:
      - jellycrew-data:/data # the only state: app.db (+ WAL files)
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.jellycrew.loadbalancer.server.port=3000
      # 1) Admin UI: only reachable on the internal hostname (LAN / VPN DNS).
      - traefik.http.routers.jellycrew-admin.rule=Host(`users.home.arpa`)
      - traefik.http.routers.jellycrew-admin.entrypoints=websecure
      - traefik.http.routers.jellycrew-admin.tls=true
      - traefik.http.routers.jellycrew-admin.service=jellycrew
      # 2) Public self-service: only the public paths and their assets. Everything else on this
      #    hostname (including /users, /profiles, /login) is not routed and gets Traefik's 404.
      - traefik.http.routers.jellycrew-public.rule=Host(`users.example.com`) && (PathPrefix(`/invite`) || PathPrefix(`/reset`) || PathPrefix(`/me`) || Path(`/healthz`) || PathPrefix(`/api/public`) || PathPrefix(`/_next/static`) || Path(`/favicon.ico`))
      - traefik.http.routers.jellycrew-public.entrypoints=websecure
      - traefik.http.routers.jellycrew-public.tls=true
      - traefik.http.routers.jellycrew-public.service=jellycrew
      # Optional: a rate limit in front of the public router as a second line of defence.
      - traefik.http.middlewares.jellycrew-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.jellycrew-ratelimit.ratelimit.burst=60
      - traefik.http.routers.jellycrew-public.middlewares=jellycrew-ratelimit

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellycrew-data:
