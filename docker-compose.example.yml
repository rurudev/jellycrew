# Example deployment: Jellyfin and jellycrew side by side.
#
# Copy to docker-compose.yml, fill in the values (or a .env file) and adjust the paths and
# addresses. Port 3000 serves both the admin console and the guest pages, so read "Exposure" in
# the README before publishing it beyond your LAN.
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    ports:
      - "8096:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - /srv/media:/media:ro
    restart: unless-stopped

  jellycrew:
    image: ghcr.io/rurudev/jellycrew:latest # or: build: .
    depends_on:
      - jellyfin
    ports:
      - "3000:3000" # narrow to one interface, e.g. "192.168.1.10:3000:3000"
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?create one in Jellyfin Dashboard > API Keys}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?the address guests use, e.g. http://192.168.1.10:3000}
      SESSION_SECRET: ${SESSION_SECRET:?openssl rand -hex 32}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_LEVEL: info
      # DATA_DIR defaults to /data inside the image
    volumes:
      - jellycrew-data:/data # the only state: app.db (+ WAL files)
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
  jellycrew-data:
